{% extends 'base.html' %}
{% block title %}Logout — ChatApp{% endblock %}

{% block extra_css %}
<style>
.auth-wrapper {
    min-height: calc(100vh - 60px);
    display: flex; align-items: center; justify-content: center; padding: 32px 16px;
}
.auth-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px; width: 100%; max-width: 400px;
    box-shadow: var(--shadow); text-align: center;
}
.auth-icon {
    width: 64px; height: 64px;
    background: rgba(246,109,109,0.12);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    font-size: 1.5rem; color: var(--danger);
}
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-icon"><i class="fas fa-sign-out-alt"></i></div>
        <h2 style="margin-bottom:8px;">Sign Out?</h2>
        <p style="color:var(--text-secondary); margin-bottom:24px;">You will be logged out of your account.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-full">
                <i class="fas fa-sign-out-alt"></i> Yes, Log Me Out
            </button>
        </form>
        <a href="{% url 'chat:home' %}" class="btn btn-outline btn-full mt-2">
            <i class="fas fa-arrow-left"></i> Cancel
        </a>
    </div>
</div>
{% endblock %}
